<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroCalc HD - Modern Glassmorphism Calculator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            glass: {
              card: 'rgba(15, 23, 42, 0.72)',
              panel: 'rgba(30, 41, 59, 0.5)',
              button: 'rgba(255, 255, 255, 0.05)',
              buttonHover: 'rgba(255, 255, 255, 0.12)',
              border: 'rgba(255, 255, 255, 0.12)',
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 25px -4px rgba(6, 182, 212, 0.4)',
            'glow-indigo': '0 0 30px -4px rgba(99, 102, 241, 0.4)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #0f172a 0%, #020617 100%);
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .glass-effect {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans flex items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Ambient Lighting Elements -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none animate-pulse" style="animation-duration: 6s;"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none animate-pulse" style="animation-duration: 8s;"></div>

  <!-- Main Calculator Card -->
  <div class="relative w-full max-w-sm sm:max-w-md bg-glass-card glass-effect border border-glass-border rounded-3xl p-6 shadow-2xl overflow-hidden transition-all duration-300">

    <!-- Header with Title & History Toggle -->
    <div class="flex items-center justify-between pb-4 border-b border-glass-border/40">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-glow-cyan animate-ping"></div>
        <h1 class="text-sm font-semibold tracking-wider text-slate-300 uppercase">AeroCalc HD</h1>
      </div>
      <button id="btn-toggle-history" aria-label="Toggle History" class="px-3 py-1.5 text-xs font-medium rounded-full bg-glass-button hover:bg-glass-buttonHover border border-glass-border transition-colors duration-200 flex items-center gap-1.5 text-slate-300 hover:text-white">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>History</span>
      </button>
    </div>

    <!-- Display Screen -->
    <div class="my-5 px-4 py-5 rounded-2xl bg-slate-950/40 border border-glass-border/60 flex flex-col justify-end text-right min-h-[110px] relative overflow-hidden">
      <div id="sub-display" class="text-xs sm:text-sm font-medium text-slate-400 tracking-wide h-5 overflow-x-auto whitespace-nowrap"></div>
      <div id="main-display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white mt-1 break-all">0</div>
    </div>

    <!-- Keypad Grid -->
    <div class="grid grid-cols-4 gap-3">
      <!-- Row 1 -->
      <button class="calc-btn text-rose-400 font-semibold bg-rose-500/10 hover:bg-rose-500/20 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-rose-500/20 shadow-sm text-base" data-action="clear-all">AC</button>
      <button class="calc-btn text-amber-400 font-semibold bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-amber-500/20 shadow-sm text-base" data-action="backspace">⌫</button>
      <button class="calc-btn text-cyan-400 font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border shadow-sm text-base" data-action="percent">%</button>
      <button class="calc-btn text-indigo-400 font-semibold bg-indigo-500/15 hover:bg-indigo-500/25 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-indigo-500/30 shadow-sm text-xl" data-action="operator" data-val="/">÷</button>

      <!-- Row 2 -->
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="7">7</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="8">8</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="9">9</button>
      <button class="calc-btn text-indigo-400 font-semibold bg-indigo-500/15 hover:bg-indigo-500/25 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-indigo-500/30 shadow-sm text-xl" data-action="operator" data-val="*">×</button>

      <!-- Row 3 -->
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="4">4</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="5">5</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="6">6</button>
      <button class="calc-btn text-indigo-400 font-semibold bg-indigo-500/15 hover:bg-indigo-500/25 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-indigo-500/30 shadow-sm text-xl" data-action="operator" data-val="-">−</button>

      <!-- Row 4 -->
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="1">1</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="2">2</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="3">3</button>
      <button class="calc-btn text-indigo-400 font-semibold bg-indigo-500/15 hover:bg-indigo-500/25 active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-indigo-500/30 shadow-sm text-xl" data-action="operator" data-val="+">+</button>

      <!-- Row 5 -->
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-action="toggle-sign">±</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-val="0">0</button>
      <button class="calc-btn text-white font-medium bg-glass-button hover:bg-glass-buttonHover active:scale-95 transition-all duration-150 rounded-2xl p-4 border border-glass-border text-lg" data-action="decimal">.</button>
      <button class="calc-btn text-white font-bold bg-gradient-to-br from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 shadow-glow-cyan active:scale-95 transition-all duration-150 rounded-2xl p-4 text-xl" data-action="equals">=</button>
    </div>

    <!-- History Drawer Overlay -->
    <div id="history-drawer" class="absolute inset-0 bg-slate-950/95 glass-effect p-6 rounded-3xl translate-y-full transition-transform duration-300 flex flex-col z-20">
      <div class="flex items-center justify-between pb-3 border-b border-glass-border/50">
        <h2 class="text-sm font-semibold tracking-wider text-slate-200 uppercase">Past Calculations</h2>
        <div class="flex items-center gap-2">
          <button id="btn-clear-history" class="text-xs text-rose-400 hover:text-rose-300 font-medium px-2.5 py-1 rounded-lg hover:bg-rose-500/10 transition-colors">
            Clear All
          </button>
          <button id="btn-close-history" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="history-list" class="flex-1 overflow-y-auto my-3 space-y-2 pr-1">
        <p class="text-center text-sm text-slate-500 pt-16">No calculations yet</p>
      </div>
      <p class="text-[11px] text-center text-slate-500">Click any entry to reload the expression</p>
    </div>
  </div>

  <!-- Interactive Script Logic -->
  <script>
    (function() {
      let currentInput = '0';
      let previousInput = '';
      let currentOperator = null;
      let resetCurrentOnDigit = false;
      let history = [];

      const mainDisplay = document.getElementById('main-display');
      const subDisplay = document.getElementById('sub-display');
      const historyDrawer = document.getElementById('history-drawer');
      const historyList = document.getElementById('history-list');
      const btnToggleHistory = document.getElementById('btn-toggle-history');
      const btnCloseHistory = document.getElementById('btn-close-history');
      const btnClearHistory = document.getElementById('btn-clear-history');

      function updateDisplay() {
        mainDisplay.textContent = currentInput;
        if (currentOperator && previousInput !== '') {
          const symbol = currentOperator === '*' ? '×' : currentOperator === '/' ? '÷' : currentOperator;
          subDisplay.textContent = `${previousInput} ${symbol}`;
        } else {
          subDisplay.textContent = '';
        }
      }

      function inputDigit(digit) {
        if (currentInput === '0' || resetCurrentOnDigit) {
          currentInput = digit;
          resetCurrentOnDigit = false;
        } else {
          if (currentInput.length < 15) {
            currentInput += digit;
          }
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (resetCurrentOnDigit) {
          currentInput = '0.';
          resetCurrentOnDigit = false;
          updateDisplay();
          return;
        }
        if (!currentInput.includes('.')) {
          currentInput += '.';
          updateDisplay();
        }
      }

      function toggleSign() {
        if (currentInput === '0' || currentInput === 'Error') return;
        if (currentInput.startsWith('-')) {
          currentInput = currentInput.slice(1);
        } else {
          currentInput = '-' + currentInput;
        }
        updateDisplay();
      }

      function inputPercent() {
        if (currentInput === 'Error') return;
        const val = parseFloat(currentInput);
        if (!isNaN(val)) {
          currentInput = String(parseFloat((val / 100).toFixed(8)));
          updateDisplay();
        }
      }

      function backspace() {
        if (resetCurrentOnDigit || currentInput === 'Error') {
          currentInput = '0';
          resetCurrentOnDigit = false;
        } else if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
        updateDisplay();
      }

      function clearAll() {
        currentInput = '0';
        previousInput = '';
        currentOperator = null;
        resetCurrentOnDigit = false;
        updateDisplay();
      }

      function handleOperator(nextOp) {
        if (currentInput === 'Error') clearAll();

        if (currentOperator && !resetCurrentOnDigit) {
          calculateResult(false);
        }

        previousInput = currentInput;
        currentOperator = nextOp;
        resetCurrentOnDigit = true;
        updateDisplay();
      }

      function calculateResult(isFinal = true) {
        if (!currentOperator || previousInput === '') return;

        const prev = parseFloat(previousInput);
        const curr = parseFloat(currentInput);
        if (isNaN(prev) || isNaN(curr)) return;

        let result = 0;
        switch (currentOperator) {
          case '+':
            result = prev + curr;
            break;
          case '-':
            result = prev - curr;
            break;
          case '*':
            result = prev * curr;
            break;
          case '/':
            if (curr === 0) {
              currentInput = 'Error';
              previousInput = '';
              currentOperator = null;
              resetCurrentOnDigit = true;
              updateDisplay();
              return;
            }
            result = prev / curr;
            break;
          default:
            return;
        }

        // Format clean float without floating point precision artifacts
        const formattedResult = String(parseFloat(result.toFixed(10)));
        const symbol = currentOperator === '*' ? '×' : currentOperator === '/' ? '÷' : currentOperator;

        if (isFinal) {
          addHistory(`${previousInput} ${symbol} ${currentInput}`, formattedResult);
          previousInput = '';
          currentOperator = null;
        } else {
          previousInput = formattedResult;
        }

        currentInput = formattedResult;
        resetCurrentOnDigit = true;
        updateDisplay();
      }

      function addHistory(expression, result) {
        history.unshift({ expression, result });
        if (history.length > 25) history.pop();
        renderHistory();
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<p class="text-center text-sm text-slate-500 pt-16">No calculations yet</p>';
          return;
        }
        historyList.innerHTML = '';
        history.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'p-3 rounded-xl bg-glass-button hover:bg-glass-buttonHover cursor-pointer border border-glass-border/40 transition-colors flex justify-between items-center';
          row.innerHTML = `
            <span class="text-xs text-slate-400 truncate max-w-[170px]">${item.expression}</span>
            <span class="text-sm font-semibold text-cyan-400">= ${item.result}</span>
          `;
          row.addEventListener('click', () => {
            currentInput = item.result;
            previousInput = '';
            currentOperator = null;
            resetCurrentOnDigit = true;
            updateDisplay();
            toggleHistoryDrawer(false);
          });
          historyList.appendChild(row);
        });
      }

      function toggleHistoryDrawer(open) {
        if (open) {
          historyDrawer.classList.remove('translate-y-full');
          historyDrawer.classList.add('translate-y-0');
        } else {
          historyDrawer.classList.add('translate-y-full');
          historyDrawer.classList.remove('translate-y-0');
        }
      }

      // Button Click Delegations
      document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-val');
          const action = btn.getAttribute('data-action');

          if (val !== null && !action) {
            inputDigit(val);
          } else if (action === 'decimal') {
            inputDecimal();
          } else if (action === 'operator') {
            handleOperator(val);
          } else if (action === 'equals') {
            calculateResult(true);
          } else if (action === 'clear-all') {
            clearAll();
          } else if (action === 'backspace') {
            backspace();
          } else if (action === 'percent') {
            inputPercent();
          } else if (action === 'toggle-sign') {
            toggleSign();
          }
        });
      });

      // History Toggle Listeners
      btnToggleHistory.addEventListener('click', () => toggleHistoryDrawer(true));
      btnCloseHistory.addEventListener('click', () => toggleHistoryDrawer(false));
      btnClearHistory.addEventListener('click', () => {
        history = [];
        renderHistory();
      });

      // Keyboard Support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          inputDigit(e.key);
        } else if (e.key === '.') {
          inputDecimal();
        } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
          handleOperator(e.key);
        } else if (e.key === 'Enter' || e.key === '=') {
          e.preventDefault();
          calculateResult(true);
        } else if (e.key === 'Backspace') {
          backspace();
        } else if (e.key === 'Escape') {
          toggleHistoryDrawer(false);
          clearAll();
        } else if (e.key === '%') {
          inputPercent();
        }
      });
    })();
  </script>
</body>
</html>
